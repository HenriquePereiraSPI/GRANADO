<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Header · MES Apriso</title>

    <!-- Detecção de AMBIENTE o mais cedo possível (antes do 1º paint): marca a
         classe no <html> para o CSS já aplicar o tema DEV/QA sem "piscar" (FOUC).
         Produção não recebe classe -> header fica na cor padrão. -->
    <script>
        (function () {
            var o = '';
            try { o = (window.top.location.origin || '').toLowerCase(); }
            catch (e) { try { o = (window.location.origin || '').toLowerCase(); } catch (_) { o = ''; } }
            var root = document.documentElement;
            // env-host-* = ambiente REAL (pela URL); env-* = tema aplicado (pode mudar via seletor no DEV).
            if (o.indexOf('mes-teste.granado.com.br') !== -1) root.classList.add('env-host-dev', 'env-nonprod', 'env-dev');
            else if (o.indexOf('mes-web-qa.granado.com.br') !== -1) root.classList.add('env-host-qa', 'env-nonprod', 'env-qa');
            else root.classList.add('env-host-prod', 'env-prod');
        })();
    </script>

    <!-- Componentes Granado usados pelo header (popup de confirmação, chamada de DFC,
         preloader e toast do logout). -->
    <script src="[AprisoScripts]/WebComponents/granado-base-api.js"></script>
    <script src="[AprisoScripts]/WebComponents/granado-option-popup.js"></script>
    <script src="[AprisoScripts]/WebComponents/granado-preloader.js"></script>
    <script src="[AprisoScripts]/WebComponents/granado-toast.js"></script>
</head>

<body>

    <!-- ============================================================
         ============================ WEB ===========================
         ============================================================ -->
    <div id="HEADER_WEB">
        <header class="topbar">

            <!-- ============ BREADCRUMB ============ -->
            <div class="topbar-breadcrumb">
                <button type="button" class="tb-home" data-flx-bind="Action" value="OPEN_HOME">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 12 12 3l9 9" />
                        <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10" />
                    </svg>
                    <span class="tb-home__label">MES Apriso</span>
                </button>
                <span class="tb-sep" aria-hidden="true">&rsaquo;</span>
                <strong class="tb-page">{ScreenTitle}</strong>
            </div>

            <!-- ============ RIGHT ============ -->
            <div class="topbar-right">

                <!-- Badges de ambiente (ocultos por padrão; o CSS mostra o do ambiente atual). -->
                <span class="tb-env-badge tb-env-badge--dev" title="Ambiente de Desenvolvimento/Teste">DEV</span>
                <span class="tb-env-badge tb-env-badge--qa" title="Ambiente de Qualidade">QA</span>

                <!-- Seletor de TEMA — só aparece no host DEV (classe .env-host-dev). -->
                <div class="tb-theme-wrap">
                    <button type="button" class="tb-icon tb-theme-btn" title="Trocar tema" aria-label="Trocar tema"
                        aria-haspopup="menu" aria-expanded="false" onclick="__toggleThemeMenu(event)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="13.5" cy="6.5" r="1.5" fill="currentColor" stroke="none" />
                            <circle cx="17.5" cy="10.5" r="1.5" fill="currentColor" stroke="none" />
                            <circle cx="8.5" cy="7.5" r="1.5" fill="currentColor" stroke="none" />
                            <circle cx="6.5" cy="12.5" r="1.5" fill="currentColor" stroke="none" />
                            <path d="M12 2a10 10 0 1 0 0 20c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1A1.5 1.5 0 0 1 14 16.5h1.5a4.5 4.5 0 0 0 4.5-4.5A10 10 0 0 0 12 2z" />
                        </svg>
                    </button>
                    <div class="tb-theme-menu" id="tb-theme-menu" role="menu">
                        <button type="button" role="menuitem" onclick="__setTheme('dev')"><span class="tb-theme-dot" style="background:#0B3550"></span>DEV · azul</button>
                        <button type="button" role="menuitem" onclick="__setTheme('qa')"><span class="tb-theme-dot" style="background:#3E1316"></span>QA · Marsala</button>
                        <button type="button" role="menuitem" onclick="__setTheme('prod')"><span class="tb-theme-dot" style="background:#0F3319"></span>PROD · verde</button>
                    </div>
                </div>

                <button type="button" class="tb-icon" title="Notificacoes" aria-label="Notificacoes">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                    </svg>
                    <span class="tb-icon-dot"></span>
                </button>

                <div class="tb-user-wrap">
                    <button type="button" class="tb-user" id="user-button" title="Sair" aria-label="Sair"
                        onClick="Logout_Apriso()">
                        <span class="tb-user-avatar">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                        </span>
                        <span class="tb-user-name">{UserName}</span>
                    </button>

                </div>

            </div>

        </header>
    </div>

    <!-- ============================================================
         ========================== MOBILE ==========================
         ============================================================ -->
    <div id="HEADER_MOBILE" style="display:none">
        <header class="topbar topbar-mobile">

            <!-- ============ MENU (abre o drawer da sidebar) ============ -->
            <button type="button" class="tb-hamburger" aria-label="Abrir menu">
                <span class="tb-hamburger-bar"></span>
                <span class="tb-hamburger-bar"></span>
                <span class="tb-hamburger-bar"></span>
            </button>

            <!-- ============ TÍTULO DA TELA ============ -->
            <div class="topbar-breadcrumb">
                <strong class="tb-page">{ScreenTitle}</strong>
            </div>

            <!-- ============ RIGHT (badge + usuário) ============ -->
            <div class="topbar-right">

                <!-- Badges de ambiente (ocultos por padrão; o CSS mostra o do ambiente atual). -->
                <span class="tb-env-badge tb-env-badge--dev" title="Ambiente de Desenvolvimento/Teste">DEV</span>
                <span class="tb-env-badge tb-env-badge--qa" title="Ambiente de Qualidade">QA</span>

                <span class="tb-logo-mobile"><span class="tb-logo-mark">G</span>GRANADO</span>

                <div class="tb-user-wrap">
                    <button type="button" class="tb-user" title="Usuario" aria-label="Usuario" aria-haspopup="menu"
                        aria-expanded="false">
                        <span class="tb-user-avatar">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                        </span>
                    </button>

                    <div class="tb-user-menu" role="menu">
                        <button type="button" class="tb-user-menu-item" onClick="Logout_Apriso()">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                <polyline points="16 17 21 12 16 7" />
                                <line x1="21" y1="12" x2="9" y2="12" />
                            </svg>
                            Sair
                        </button>
                    </div>
                </div>

            </div>

        </header>
    </div>

</body>

</html>

<script>
    (function () {

        function init() {

            if (typeof $Context !== 'undefined') {
                window.AprisoHeaderContext = $Context;
            }

            initHeaderEvents();
            initResponsiveLayoutHeader();
            waitForDashboard();

        }
        // Garante que so roda depois do DOM montado
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
</script>
